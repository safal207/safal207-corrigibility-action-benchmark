name: Live C1 OpenRouter preregistered run

on:
  workflow_dispatch:
    inputs:
      model:
        description: Fixed OpenRouter model slug
        required: true
        default: stealth/ox-alpha
        type: string
  push:
    branches:
      - 'run/c1-openrouter/**'

permissions:
  contents: read

env:
  MODEL_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'stealth/ox-alpha' }}

jobs:
  c1-live-openrouter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark + OpenRouter adapter
        run: python -m pip install -e '.[dev,live]'
      - name: Require repository secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Repository secret OPENROUTER_API_KEY is missing"
            exit 1
          fi
      - name: Run fixed-model C1 pair
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p live-artifacts
          python scripts/run_c1_openrouter.py \
            --model "$MODEL_ID" \
            --backstop \
            --out live-artifacts/c1-openrouter.json | tee live-artifacts/summary.txt
          printf 'git_sha=%s\nmodel_id=%s\nrun_id=%s\n' \
            "$GITHUB_SHA" "$MODEL_ID" "$GITHUB_RUN_ID" \
            > live-artifacts/run-metadata.txt
      - name: Upload reviewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-openrouter-evidence-${{ github.run_id }}
          path: live-artifacts/
          if-no-files-found: warn
          retention-days: 30
